<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview 2 - Getränkekarte</title>
    <link rel="icon" type="image/png" href="images/schlegl-app-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        .overview-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .overview-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .overview-frame.active {
            opacity: 1;
        }

        .overview-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body data-overview="overview-2">
    <div class="overview-container">
        <div class="overview-frame" id="hauptthekeFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="haupttheke-modernFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="theke-hintenFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="theke-hinten-bilderFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="theke-hinten-bilder-dunkelFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="theke-hinten-2Frame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="hochzeitFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="hochzeit-dunkelFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="hochzeit-3spaltenFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="hochzeit-dunkel-3spaltenFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="jugendlicheFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="speisekarteFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="bilderFrame">
            <iframe></iframe>
        </div>
        <div class="overview-frame" id="screensaverFrame">
            <iframe></iframe>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/overview-player.js"></script>
</body>
</html>
